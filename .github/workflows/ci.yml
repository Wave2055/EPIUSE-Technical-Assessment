# Continuous integration (ADR-0019): every push and pull request runs lint, typecheck,
# unit tests, integration tests against a real PostgreSQL (ADR-0020), both builds, and a
# boot test of the production API image, and the browser tests against the whole
# application built and run in Docker (ADR-0035).
#
# Deployment on merge to main (ECR + SSM for the API, S3 + CloudFront for the SPA) is a
# separate workflow, added once the Terraform infrastructure exists.
#
# Third-party actions are pinned to full commit SHAs, with the release tag alongside, so a
# moved or compromised tag cannot change what runs here.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never writes to the repository. Deploy jobs will request OIDC
# (id-token: write) for themselves.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Also runs `prisma generate` through the API's postinstall.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The apps import @epiuse/shared from its build output, so it must exist before any
      # typecheck, lint or test of its dependents (ADR-0003).
      - name: Build shared package
        run: pnpm --filter @epiuse/shared build

      - name: Scan for secrets
        run: pnpm scan:secrets

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @epiuse/shared build

      # GitHub's Ubuntu runners include Docker, which Testcontainers uses to start a
      # throwaway PostgreSQL per suite. Migrations are applied exactly as in production,
      # so a broken migration fails here rather than on deploy (ADR-0020).
      - name: Pull PostgreSQL image
        run: docker pull postgres:17-alpine

      - name: Integration tests
        run: pnpm test:integration

  image:
    name: API image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build -f apps/api/Dockerfile -t epiuse-api:ci .

      # The production image against a real database: migrations apply from inside the
      # container, the seed runs, and the API passes its own HEALTHCHECK. This catches a
      # file left out of the image, which the other jobs cannot see.
      - name: Smoke test
        env:
          # Password-less (trust auth): a throwaway database on a private network.
          DATABASE_URL: postgresql://epiuse@db:5432/epiuse
          JWT_ACCESS_SECRET: ci-only-signing-key-that-is-long-enough-to-pass
          ORIGIN_SECRET: ci-only-origin-secret
          SEED_ADMIN_PASSWORD: ci-only-admin-password
          SEED_VIEWER_PASSWORD: ci-only-viewer-password
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e POSTGRES_USER=epiuse -e POSTGRES_DB=epiuse -e POSTGRES_HOST_AUTH_METHOD=trust \
            --health-cmd 'pg_isready -U epiuse' --health-interval 2s postgres:17-alpine
          until [ "$(docker inspect -f '{{.State.Health.Status}}' db)" = healthy ]; do sleep 2; done

          docker run -d --name api --network smoke \
            -e DATABASE_URL -e JWT_ACCESS_SECRET -e ORIGIN_SECRET epiuse-api:ci
          for _ in $(seq 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' api)" = false ] && break
            sleep 2
          done
          docker logs api
          [ "$status" = healthy ]

          docker run --rm --network smoke -e DATABASE_URL \
            -e SEED_ADMIN_PASSWORD -e SEED_VIEWER_PASSWORD epiuse-api:ci prisma db seed

  e2e:
    name: End-to-end tests (full Docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Only Playwright runs on the runner; the application under test is built from source
      # into images and run in Docker (ADR-0035).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @epiuse/web exec playwright install --with-deps chromium

      # Builds the production API image and web build, starts them on PostgreSQL behind
      # the CloudFront stand-in, seeds, runs every spec, and tears down. Secrets are random
      # per run.
      - name: End-to-end tests
        run: pnpm test:e2e:docker

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
